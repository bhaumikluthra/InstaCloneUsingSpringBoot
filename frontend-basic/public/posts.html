<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone API Test - Posts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-brand">InstaClone</a>
            <div class="nav-links">
                <a href="user.html" class="nav-link">User Profile</a>
                <a href="posts.html" class="nav-link">Posts</a>
                <a href="view.html" class="nav-link">View Data</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Posts Management</h1>

        <div class="section">
            <h2>Create Post</h2>
            <form id="post-form">
                <div class="form-group">
                    <label for="post-username">Username</label>
                    <input type="text" id="post-username" required 
                           placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="post-title">Title (2-15 characters)</label>
                    <input type="text" id="post-title" required 
                           minlength="2" maxlength="15" 
                           placeholder="Enter post title">
                </div>
                <div class="form-group">
                    <label for="post-content">Content (12-180 characters)</label>
                    <textarea id="post-content" required 
                            minlength="12" maxlength="180" 
                            placeholder="Write your post content here..."></textarea>
                </div>
                <button type="submit">Create Post</button>
            </form>
            <div id="post-response" class="response"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Create Post
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const data = {
                    userName: document.getElementById('post-username').value,
                    postTitle: document.getElementById('post-title').value,
                    postContent: document.getElementById('post-content').value
                };
                const response = await apiRequest('/uploadPost', 'POST', data);
                updateResponse('post-response', response);
                e.target.reset();
            } catch (error) {
                updateResponse('post-response', error.message, true);
            }
        });
    </script>
</body>
</html>

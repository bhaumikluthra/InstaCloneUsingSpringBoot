<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="instagram-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">InstaClone</a>
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="userSearch" placeholder="Search users" oninput="searchUsers()">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div class="nav-right">
                <div class="profile-dropdown">
                    <img src="https://via.placeholder.com/32" alt="Profile" id="profileImage" class="profile-img">
                    <div class="dropdown-content">
                        <a href="#" onclick="showProfile()">Profile</a>
                        <a href="#" onclick="showEditProfile()">Edit Profile</a>
                        <a href="index.html">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <!-- Stories Section (placeholder) -->
        <div class="stories-container">
            <div class="story-item">
                <div class="story-circle">
                    <img src="https://via.placeholder.com/60" alt="Your Story">
                </div>
                <span>Your Story</span>
            </div>
            <!-- More stories can be added dynamically -->
        </div>

        <!-- Feed Section -->
        <div class="feed-container" id="feedContainer">
            <!-- Posts will be added here dynamically -->
        </div>

        <!-- Profile Modal -->
        <div id="profileModal" class="modal">
            <div class="modal-content profile-modal">
                <span class="close-modal" onclick="closeModal('profileModal')">&times;</span>
                <div class="profile-header">
                    <img src="https://via.placeholder.com/150" alt="Profile" class="profile-picture">
                    <div class="profile-info">
                        <h2 id="profileUsername">Username</h2>
                        <div class="profile-stats">
                            <div class="stat-item"><strong id="postsCount">0</strong> posts</div>
                            <div class="stat-item"><strong id="followersCount">0</strong> followers</div>
                            <div class="stat-item"><strong id="followingCount">0</strong> following</div>
                        </div>
                        <button onclick="showEditProfile()" class="edit-profile-btn">Edit Profile</button>
                    </div>
                </div>
                <div class="profile-posts" id="userPosts">
                    <!-- User posts will be added here -->
                </div>
            </div>
        </div>

        <!-- Edit Profile Modal -->
        <div id="editProfileModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal('editProfileModal')">&times;</span>
                <h2>Edit Profile</h2>
                <form id="editProfileForm" onsubmit="updateProfile(event)">
                    <div class="form-group">
                        <label for="editName">Name</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label for="editUsername">Username</label>
                        <input type="text" id="editUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="editBio">Bio</label>
                        <textarea id="editBio" rows="3"></textarea>
                    </div>
                    <button type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        let currentUser = null;
        let allPosts = [];

        // Initialize dashboard
        async function initDashboard() {
            try {
                await loadCurrentUser();
                await loadFeed();
            } catch (error) {
                console.error('Error initializing dashboard:', error);
            }
        }

        // Load current user data
        async function loadCurrentUser() {
            try {
                // For now, we'll use a placeholder user
                currentUser = {
                    username: 'current_user',
                    name: 'Current User',
                    bio: '',
                    posts: 0,
                    followers: 0,
                    following: 0
                };
                updateProfileUI();
            } catch (error) {
                console.error('Error loading current user:', error);
            }
        }

        // Load feed posts
        async function loadFeed() {
            try {
                const response = await apiRequest('/allposts', 'GET');
                allPosts = response || [];
                displayPosts();
            } catch (error) {
                console.error('Error loading feed:', error);
            }
        }

        // Display posts in feed
        function displayPosts() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = allPosts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <img src="https://via.placeholder.com/32" alt="${post.username}" class="post-profile-img">
                        <span class="post-username">${post.username}</span>
                    </div>
                    <div class="post-content">
                        <p>${post.caption || ''}</p>
                    </div>
                    <div class="post-actions">
                        <button onclick="likePost('${post.id}')" class="action-btn">
                            <i class="far fa-heart"></i>
                        </button>
                        <button onclick="commentPost('${post.id}')" class="action-btn">
                            <i class="far fa-comment"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Search users
        async function searchUsers() {
            const searchTerm = document.getElementById('userSearch').value;
            if (searchTerm.length < 2) {
                document.getElementById('searchResults').style.display = 'none';
                return;
            }

            try {
                const response = await apiRequest('/allusers', 'GET');
                const users = response.filter(user => 
                    user.username.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const resultsDiv = document.getElementById('searchResults');
                resultsDiv.innerHTML = users.map(user => `
                    <div class="search-result-item" onclick="viewProfile('${user.username}')">
                        <img src="https://via.placeholder.com/32" alt="${user.username}">
                        <span>${user.username}</span>
                    </div>
                `).join('');
                resultsDiv.style.display = users.length ? 'block' : 'none';
            } catch (error) {
                console.error('Error searching users:', error);
            }
        }

        // Show profile modal
        function showProfile() {
            document.getElementById('profileModal').style.display = 'block';
            loadUserPosts(currentUser.username);
        }

        // Show edit profile modal
        function showEditProfile() {
            document.getElementById('editProfileModal').style.display = 'block';
            document.getElementById('editName').value = currentUser.name;
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editBio').value = currentUser.bio;
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Update profile
        async function updateProfile(event) {
            event.preventDefault();
            const newName = document.getElementById('editName').value;
            const newUsername = document.getElementById('editUsername').value;
            const newBio = document.getElementById('editBio').value;

            try {
                // Update user info through API
                await apiRequest('/updateUser', 'PUT', {
                    username: newUsername,
                    name: newName,
                    bio: newBio
                });

                currentUser = {
                    ...currentUser,
                    name: newName,
                    username: newUsername,
                    bio: newBio
                };

                updateProfileUI();
                closeModal('editProfileModal');
            } catch (error) {
                console.error('Error updating profile:', error);
            }
        }

        // Update profile UI
        function updateProfileUI() {
            document.getElementById('profileUsername').textContent = currentUser.username;
            document.getElementById('postsCount').textContent = currentUser.posts;
            document.getElementById('followersCount').textContent = currentUser.followers;
            document.getElementById('followingCount').textContent = currentUser.following;
        }

        // Load user posts
        async function loadUserPosts(username) {
            try {
                const response = await apiRequest(`/allpost/${username}`, 'GET');
                const posts = response || [];
                
                document.getElementById('userPosts').innerHTML = posts.map(post => `
                    <div class="profile-post">
                        <img src="https://via.placeholder.com/150" alt="Post">
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading user posts:', error);
            }
        }

        // Initialize dashboard on load
        window.onload = initDashboard;

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
